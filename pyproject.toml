[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blast-radius-engine"
version = "0.2.0"
description = "Real-time eBPF-powered Cloud & Identity Blast-Radius Containment Engine with Sarvam AI"
authors = [{ name = "Skeletor-Pirate" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "cryptography>=41.0",
    "httpx>=0.25.0",
    "networkx>=3.0",
    "jinja2>=3.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[project.scripts]
blast-radius = "run_demo:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestDeprecationWarning",
]